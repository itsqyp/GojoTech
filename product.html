<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Product | GojoTech</title>

    <link rel="stylesheet" href="./src/output.css" />
    <link rel="stylesheet" href="./node_modules/aos/dist/aos.css" />
  </head>

  <body class="bg-white text-slate-900">
    <!-- Navbar -->
    <header id="site-header" data-aos="fade-up"></header>

    <main data-aos="fade-up">
      <!-- Product Details -->
      <section>
        <div
          id="product-details"
          class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8 lg:py-20"
        ></div>
      </section>
    </main>
    <footer id="site-footer" data-aos="fade-up"></footer>
    <script src="./node_modules/aos/dist/aos.js"></script>
    <script>
      AOS.init({
        duration: 700,
        once: true,
        offset: 80,
      });
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="./src/data/products.js"></script>
    <script src="./src/js/toast.js"></script>
    <script src="./src/js/cart.js"></script>
    <script src="./src/js/wishlist.js"></script>
    <script src="./src/js/product-card.js"></script>
    <script src="./src/js/product-details.js"></script>
    <script src="./src/js/mobile-menu.js"></script>
    <script src="./src/js/navbar.js"></script>
    <script src="./src/js/footer.js"></script>
    <script>
      lucide.createIcons();
      updateCartCount();
    </script>
  </body>
</html>
