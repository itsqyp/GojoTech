<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Products | GojoTech</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./src/output.css" />
  </head>

  <body class="font-sans text-slate-900">
    <!-- Navbar -->
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="flex h-16 items-center justify-between">
          <!-- Logo -->
          <a
            href="./index.html"
            class="text-xl font-bold tracking-tight text-slate-900"
          >
            GojoTech
          </a>

          <!-- Desktop Navigation -->
          <nav
            class="hidden items-center gap-8 md:flex"
            aria-label="Main navigation"
          >
            <a
              href="./index.html"
              class="text-sm font-medium text-slate-600 transition-colors hover:text-slate-900"
            >
              Home
            </a>

            <a
              href="./products.html"
              class="text-sm font-medium text-indigo-600"
            >
              Products
            </a>

            <a
              href="#"
              class="text-sm font-medium text-slate-600 transition-colors hover:text-slate-900"
            >
              Categories
            </a>
          </nav>

          <!-- Actions -->
          <div class="flex items-center gap-5">
            <button
              type="button"
              aria-label="Search"
              class="text-slate-600 transition-colors hover:text-slate-900"
            >
              <i data-lucide="search" class="h-5 w-5"></i>
            </button>

            <button
              type="button"
              aria-label="Wishlist"
              class="text-slate-600 transition-colors hover:text-slate-900"
            >
              <i data-lucide="heart" class="h-5 w-5"></i>
            </button>

            <a
              href="./cart.html"
              aria-label="Shopping cart"
              class="relative text-slate-600 hover:text-slate-900"
            >
              <i data-lucide="shopping-cart" class="h-5 w-5"></i>

              <span
                data-cart-count
                class="absolute -right-2 -top-2 flex h-4 min-w-4 items-center justify-center rounded-full bg-indigo-600 px-1 text-[10px] font-semibold text-white"
              >
                0
              </span>
            </a>

            <button
              type="button"
              aria-label="Account"
              class="text-slate-600 transition-colors hover:text-slate-900"
            >
              <i data-lucide="user" class="h-5 w-5"></i>
            </button>
          </div>

          <!-- Mobile Menu Button -->
          <button
            type="button"
            id="mobile-menu-button"
            aria-label="Open menu"
            aria-expanded="false"
            class="text-slate-700 md:hidden"
          >
            <i data-lucide="menu" class="h-6 w-6"></i>
          </button>
        </div>
      </div>

      <!-- Mobile Menu -->
      <div id="mobile-menu" class="hidden border-t border-slate-200 md:hidden">
        <nav
          class="mx-auto max-w-7xl px-4 py-4 sm:px-6"
          aria-label="Mobile navigation"
        >
          <div class="flex flex-col gap-4">
            <a
              href="./index.html"
              class="text-sm font-medium text-slate-700 hover:text-slate-900"
            >
              Home
            </a>

            <a
              href="./products.html"
              class="text-sm font-medium text-indigo-600"
            >
              Products
            </a>

            <a
              href="#"
              class="text-sm font-medium text-slate-700 hover:text-slate-900"
            >
              Categories
            </a>
          </div>
        </nav>
      </div>
    </header>

    <main>
      <!-- Products Header -->
      <section class="bg-slate-50">
        <div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
          <p class="text-sm font-semibold text-indigo-600">Our collection</p>

          <h1 class="mt-2 text-4xl font-bold tracking-tight text-slate-900">
            All Products
          </h1>

          <p class="mt-4 max-w-2xl text-slate-600">
            Explore our complete collection of premium technology designed for
            modern life.
          </p>
        </div>
      </section>

      <!-- Products -->
      <section class="bg-white">
        <div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
          <!-- Search -->
          <div class="max-w-xl">
            <label for="product-search" class="sr-only">
              Search products
            </label>

            <div class="relative">
              <i
                data-lucide="search"
                class="pointer-events-none absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-400"
              ></i>

              <input
                id="product-search"
                type="search"
                placeholder="Search products..."
                autocomplete="off"
                class="w-full rounded-lg border border-slate-300 bg-white py-3 pl-11 pr-4 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
              />
            </div>
          </div>

          <!-- Category Filters -->

          <div class="mt-6">
            <div class="flex flex-wrap gap-2">
              <button
                type="button"
                class="category-filter rounded-full bg-slate-900 px-4 py-2 text-sm font-medium text-white"
                data-category="all"
              >
                All
              </button>

              <button
                type="button"
                class="category-filter rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-600 transition-colors hover:border-slate-400 hover:text-slate-900"
                data-category="laptops"
              >
                Laptops
              </button>

              <button
                type="button"
                class="category-filter rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-600 transition-colors hover:border-slate-400 hover:text-slate-900"
                data-category="smartphones"
              >
                Smartphones
              </button>

              <button
                type="button"
                class="category-filter rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-600 transition-colors hover:border-slate-400 hover:text-slate-900"
                data-category="headphones"
              >
                Headphones
              </button>

              <button
                type="button"
                class="category-filter rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-600 transition-colors hover:border-slate-400 hover:text-slate-900"
                data-category="keyboards"
              >
                Keyboards
              </button>

              <button
                type="button"
                class="category-filter rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-600 transition-colors hover:border-slate-400 hover:text-slate-900"
                data-category="mice"
              >
                Mice
              </button>

              <button
                type="button"
                class="category-filter rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-600 transition-colors hover:border-slate-400 hover:text-slate-900"
                data-category="accessories"
              >
                Accessories
              </button>
            </div>
          </div>

          <!-- Product Count -->
          <div class="mt-8">
            <div
              class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between"
            >
              <p id="product-count" class="text-sm text-slate-500"></p>

              <div class="flex items-center gap-3">
                <label
                  for="sort-products"
                  class="text-sm font-medium text-slate-700"
                >
                  Sort by
                </label>

                <select
                  id="sort-products"
                  class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
                >
                  <option value="featured">Featured</option>

                  <option value="price-low">Price: Low to High</option>

                  <option value="price-high">Price: High to Low</option>

                  <option value="rating">Rating</option>

                  <option value="name">Name: A to Z</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Product Grid -->
          <div
            id="products-grid"
            class="mt-6 grid gap-6 sm:grid-cols-2 lg:grid-cols-3"
          ></div>
        </div>
      </section>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="./src/data/products.js"></script>
    <script src="./src/js/toast.js"></script>
    <script src="./src/js/cart.js"></script>
    <script src="./src/js/wishlist.js"></script>
    <script src="./src/js/product-card.js"></script>
    <script src="./src/js/products-page.js"></script>
    <script src="./src/js/mobile-menu.js"></script>

    <script>
      lucide.createIcons();
      updateCartCount();
    </script>
  </body>
</html>
