<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Products | GojoTech</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./src/output.css" />
    <link rel="stylesheet" href="./node_modules/aos/dist/aos.css" />
  </head>

  <body class="font-sans text-slate-900">
    <!-- Navbar -->
    <header id="site-header" data-aos="fade-up"></header>

    <main data-aos="fade-up">
      <!-- Products Header -->
      <section class="bg-slate-50">
        <div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
          <p class="text-sm font-semibold text-indigo-600">Our collection</p>

          <h1 class="mt-2 text-4xl font-bold tracking-tight text-slate-900">
            All Products
          </h1>

          <p class="mt-4 max-w-2xl text-slate-600">
            Explore our complete collection of premium technology designed for
            modern life.
          </p>
        </div>
      </section>

      <!-- Products -->
      <section class="bg-white">
        <div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
          <!-- Search -->
          <div class="max-w-xl">
            <label for="product-search" class="sr-only">
              Search products
            </label>

            <div class="relative">
              <i
                data-lucide="search"
                class="pointer-events-none absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-400"
              ></i>

              <input
                id="product-search"
                type="search"
                placeholder="Search products..."
                autocomplete="off"
                class="w-full rounded-lg border border-slate-300 bg-white py-3 pl-11 pr-4 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
              />
            </div>
          </div>

          <!-- Category Filters -->

          <div class="mt-6">
            <div class="flex flex-wrap gap-2">
              <button
                type="button"
                class="category-filter rounded-full bg-slate-900 px-4 py-2 text-sm font-medium text-white"
                data-category="all"
              >
                All
              </button>

              <button
                type="button"
                class="category-filter rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-600 transition-colors hover:border-slate-400 hover:text-slate-900"
                data-category="laptops"
              >
                Laptops
              </button>

              <button
                type="button"
                class="category-filter rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-600 transition-colors hover:border-slate-400 hover:text-slate-900"
                data-category="smartphones"
              >
                Smartphones
              </button>

              <button
                type="button"
                class="category-filter rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-600 transition-colors hover:border-slate-400 hover:text-slate-900"
                data-category="headphones"
              >
                Headphones
              </button>

              <button
                type="button"
                class="category-filter rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-600 transition-colors hover:border-slate-400 hover:text-slate-900"
                data-category="keyboards"
              >
                Keyboards
              </button>

              <button
                type="button"
                class="category-filter rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-600 transition-colors hover:border-slate-400 hover:text-slate-900"
                data-category="mice"
              >
                Mice
              </button>

              <button
                type="button"
                class="category-filter rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-600 transition-colors hover:border-slate-400 hover:text-slate-900"
                data-category="accessories"
              >
                Accessories
              </button>
            </div>
          </div>

          <!--New Feature  -->

          <div id="clear-filters-container" class="mt-4 hidden">
            <button
              id="clear-filters"
              type="button"
              class="inline-flex items-center gap-2 text-sm font-medium text-indigo-600 hover:text-indigo-700"
            >
              <i data-lucide="x" class="h-4 w-4"></i>
              Clear filters
            </button>
          </div>

          <!-- Product Count -->
          <div class="mt-8">
            <div
              class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between"
            >
              <p id="product-count" class="text-sm text-slate-500"></p>

              <div class="flex items-center gap-3">
                <label
                  for="sort-products"
                  class="text-sm font-medium text-slate-700"
                >
                  Sort by
                </label>

                <select
                  id="sort-products"
                  class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
                >
                  <option value="featured">Featured</option>

                  <option value="price-low">Price: Low to High</option>

                  <option value="price-high">Price: High to Low</option>

                  <option value="rating">Rating</option>

                  <option value="name">Name: A to Z</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Product Grid -->
          <div
            id="products-grid"
            class="mt-6 grid gap-6 sm:grid-cols-2 lg:grid-cols-3"
          ></div>
        </div>
      </section>
    </main>
    <footer id="site-footer" data-aos="fade-up"></footer>

    <script src="./node_modules/aos/dist/aos.js"></script>
    <script>
      AOS.init({
        duration: 700,
        once: true,
        offset: 80,
      });
    </script>

    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="./src/data/products.js"></script>
    <script src="./src/js/toast.js"></script>
    <script src="./src/js/cart.js"></script>
    <script src="./src/js/wishlist.js"></script>
    <script src="./src/js/product-card.js"></script>
    <script src="./src/js/products-page.js"></script>
    <script src="./src/js/mobile-menu.js"></script>
    <script src="./src/js/navbar.js"></script>
    <script src="./src/js/footer.js"></script>

    <script>
      lucide.createIcons();
      updateCartCount();
    </script>
  </body>
</html>
