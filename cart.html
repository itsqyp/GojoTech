<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- GOOGLE FONTS LINK -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=League+Script&family=Libertinus+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Roboto:ital,wght@0,100..900;1,100..900&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./node_modules/aos/dist/aos.css" />
    <!-- GOOGLE FONTS LINK -->

    <title>Shopping Cart | GojoTech</title>

    <link rel="stylesheet" href="./src/output.css" />
  </head>

  <body class="bg-slate-50 text-slate-900">
    <!-- Navbar -->
    <header id="site-header" data-aos="fade-up"></header>

    <main>
      <!-- Cart Header -->
      <section class="bg-white border-b border-slate-200" data-aos="fade-up">
        <div class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
          <p class="text-sm font-semibold text-indigo-600">Your shopping bag</p>

          <h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-900">
            Shopping Cart
          </h1>
        </div>
      </section>

      <!-- Cart Content -->
      <section data-aos="fade-up">
        <div class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
          <div
            id="cart-content"
            class="grid gap-8 lg:grid-cols-[1fr_380px]"
          ></div>
        </div>
      </section>
    </main>
    <footer id="site-footer" data-aos="fade-up"></footer>

    <script src="./node_modules/aos/dist/aos.js"></script>
    <script>
      AOS.init({
        duration: 700,
        once: true,
        offset: 80,
      });
    </script>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="./src/data/products.js"></script>
    <script src="./src/js/toast.js"></script>
    <script src="./src/js/cart.js"></script>

    <script src="./src/js/mobile-menu.js"></script>
    <script src="./src/js/cart-page.js"></script>
    <script src="./src/js/navbar.js"></script>
    <script src="./src/js/footer.js"></script>
    <script>
      lucide.createIcons();
      updateCartCount();
    </script>
  </body>
</html>
