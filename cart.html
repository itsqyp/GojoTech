<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- GOOGLE FONTS LINK -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=League+Script&family=Libertinus+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Roboto:ital,wght@0,100..900;1,100..900&family=VT323&display=swap"
      rel="stylesheet"
    />
    <!-- GOOGLE FONTS LINK -->

    <title>Shopping Cart | GojoTech</title>

    <link rel="stylesheet" href="./src/output.css" />
  </head>

  <body class="bg-slate-50 text-slate-900">
    <!-- Navbar -->
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="flex h-16 items-center justify-between">
          <a
            href="./index.html"
            class="text-xl font-bold tracking-tight text-slate-900"
          >
            GojoTech
          </a>

          <nav
            class="hidden items-center gap-8 md:flex"
            aria-label="Main navigation"
          >
            <a
              href="./index.html"
              class="text-sm font-medium text-slate-600 hover:text-slate-900"
            >
              Home
            </a>

            <a
              href="./products.html"
              class="text-sm font-medium text-slate-600 hover:text-slate-900"
            >
              Products
            </a>

            <a
              href="#"
              class="text-sm font-medium text-slate-600 hover:text-slate-900"
            >
              Categories
            </a>
          </nav>

          <div class="flex items-center gap-5">
            <button
              type="button"
              aria-label="Search"
              class="text-slate-600 hover:text-slate-900"
            >
              <i data-lucide="search" class="h-5 w-5"></i>
            </button>

            <a
              href="./wishlist.html"
              aria-label="Wishlist"
              class="text-[#61210f] transition-colors hover:text-slate-900"
            >
              <i data-lucide="heart" class="h-5 w-5"></i>
            </a>

            <a
              href="./cart.html"
              aria-label="Shopping cart"
              class="relative text-slate-600 hover:text-slate-900"
            >
              <i data-lucide="shopping-cart" class="h-5 w-5"></i>

              <span
                data-cart-count
                class="absolute -right-2 -top-2 flex h-4 min-w-4 items-center justify-center rounded-full bg-indigo-600 px-1 text-[10px] font-semibold text-white"
              >
                0
              </span>
            </a>

            <button
              type="button"
              aria-label="Account"
              class="text-slate-600 hover:text-slate-900"
            >
              <i data-lucide="user" class="h-5 w-5"></i>
            </button>
          </div>

          <button
            type="button"
            id="mobile-menu-button"
            aria-label="Open menu"
            aria-expanded="false"
            class="text-slate-700 md:hidden"
          >
            <i data-lucide="menu" class="h-6 w-6"></i>
          </button>
        </div>
      </div>

      <!-- Mobile Menu -->
      <div id="mobile-menu" class="hidden border-t border-slate-200 md:hidden">
        <nav class="mx-auto max-w-7xl px-4 py-4 sm:px-6">
          <div class="flex flex-col gap-4">
            <a href="./index.html" class="text-sm font-medium text-slate-700">
              Home
            </a>

            <a
              href="./products.html"
              class="text-sm font-medium text-slate-700"
            >
              Products
            </a>
          </div>
        </nav>
      </div>
    </header>

    <main>
      <!-- Cart Header -->
      <section class="bg-white border-b border-slate-200">
        <div class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
          <p class="text-sm font-semibold text-indigo-600">Your shopping bag</p>

          <h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-900">
            Shopping Cart
          </h1>
        </div>
      </section>

      <!-- Cart Content -->
      <section>
        <div class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
          <div
            id="cart-content"
            class="grid gap-8 lg:grid-cols-[1fr_380px]"
          ></div>
        </div>
      </section>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="./src/data/products.js"></script>
    <script src="./src/js/toast.js"></script>
    <script src="./src/js/cart.js"></script>

    <script src="./src/js/mobile-menu.js"></script>
    <script src="./src/js/cart-page.js"></script>

    <script>
      lucide.createIcons();
      updateCartCount();
    </script>
  </body>
</html>
