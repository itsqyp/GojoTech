<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Order Confirmed | GojoTech</title>

    <link rel="stylesheet" href="./src/output.css" />
    <link rel="stylesheet" href="./node_modules/aos/dist/aos.css" />
    <link rel="stylesheet" href="./node_modules/lenis/dist/lenis.css" />
  </head>

  <body class="min-h-screen bg-slate-50 text-slate-900">
    <header class="border-b border-slate-200 bg-white" data-aos="fade-up">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="flex h-16 items-center">
          <a href="./index.html" class="text-xl font-bold tracking-tight">
            GojoTech
          </a>
        </div>
      </div>
    </header>

    <main data-aos="fade-up">
      <section class="px-4 py-16 sm:px-6 lg:px-8">
        <div id="order-success" class="mx-auto max-w-2xl"></div>
      </section>
    </main>
    <footer id="site-footer" data-aos="fade-up"></footer>
    <script src="./node_modules/lenis/dist/lenis.js"></script>
    <script>
      const lenis = new Lenis();

      function raf(time) {
        lenis.raf(time);
        requestAnimationFrame(raf);
      }

      requestAnimationFrame(raf);
    </script>
    <script src="./node_modules/aos/dist/aos.js"></script>
    <script>
      AOS.init({
        duration: 700,
        once: true,
        offset: 80,
      });
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="./src/js/order-success.js"></script>
    <script src="./src/js/footer.js"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
