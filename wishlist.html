<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Wishlist | GojoTech</title>

    <link rel="stylesheet" href="./src/output.css" />
    <link rel="stylesheet" href="./node_modules/aos/dist/aos.css" />
    <link rel="stylesheet" href="./node_modules/lenis/dist/lenis.css" />
  </head>

  <body class="bg-slate-50 text-slate-900">
    <!-- Navbar -->
    <header id="site-header" data-aos="fade-up"></header>

    <main data-aos="fade-up">
      <!-- Page Header -->
      <section class="border-b border-slate-200 bg-white">
        <div class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
          <p class="text-sm font-semibold text-red-500">Saved for later</p>

          <h1 class="mt-2 text-3xl font-bold tracking-tight">My Wishlist</h1>

          <p class="mt-2 text-sm text-slate-500">
            Products you've saved for later.
          </p>
        </div>
      </section>

      <!-- Wishlist -->
      <section data-aos="fade-up">
        <div class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
          <div id="wishlist-content"></div>
        </div>
      </section>
    </main>
    <footer id="site-footer" data-aos="fade-up"></footer>

    <script src="./node_modules/lenis/dist/lenis.js"></script>
    <script>
      const lenis = new Lenis();

      function raf(time) {
        lenis.raf(time);
        requestAnimationFrame(raf);
      }

      requestAnimationFrame(raf);
    </script>

    <script src="./node_modules/aos/dist/aos.js"></script>
    <script>
      AOS.init({
        duration: 700,
        once: true,
        offset: 80,
      });
    </script>

    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="./src/data/products.js"></script>
    <script src="./src/js/toast.js"></script>
    <script src="./src/js/cart.js"></script>
    <script src="./src/js/wishlist.js"></script>
    <script src="./src/js/mobile-menu.js"></script>
    <script src="./src/js/wishlist-page.js"></script>
    <script src="./src/js/navbar.js"></script>
    <script src="./src/js/footer.js"></script>
    <script>
      lucide.createIcons();
      updateCartCount();
    </script>
  </body>
</html>
